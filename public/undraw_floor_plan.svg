<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none">
  <!-- Background shadow/base -->
  <ellipse cx="400" cy="520" rx="300" ry="18" fill="#e5e7eb" opacity="0.6"/>

  <!-- Floor plan paper/document -->
  <rect x="100" y="60" width="600" height="440" rx="12" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Grid lines (light) -->
  <g stroke="#e5e7eb" stroke-width="1" opacity="0.7">
    <line x1="100" y1="135" x2="700" y2="135"/>
    <line x1="100" y1="210" x2="700" y2="210"/>
    <line x1="100" y1="285" x2="700" y2="285"/>
    <line x1="100" y1="360" x2="700" y2="360"/>
    <line x1="100" y1="435" x2="700" y2="435"/>
    <line x1="175" y1="60" x2="175" y2="500"/>
    <line x1="250" y1="60" x2="250" y2="500"/>
    <line x1="325" y1="60" x2="325" y2="500"/>
    <line x1="400" y1="60" x2="400" y2="500"/>
    <line x1="475" y1="60" x2="475" y2="500"/>
    <line x1="550" y1="60" x2="550" y2="500"/>
    <line x1="625" y1="60" x2="625" y2="500"/>
  </g>

  <!-- Restaurant floor plan walls -->
  <!-- Outer walls -->
  <rect x="140" y="100" width="520" height="360" rx="4" stroke="#4F46E5" stroke-width="3" fill="none"/>

  <!-- Inner room dividers -->
  <line x1="140" y1="250" x2="360" y2="250" stroke="#4F46E5" stroke-width="2.5"/>
  <line x1="360" y1="100" x2="360" y2="310" stroke="#4F46E5" stroke-width="2.5"/>
  <line x1="360" y1="310" x2="660" y2="310" stroke="#4F46E5" stroke-width="2.5"/>

  <!-- Door openings (gaps in walls with arcs) -->
  <path d="M 270 250 A 25 25 0 0 1 270 200" stroke="#4F46E5" stroke-width="2" fill="none" stroke-dasharray="none"/>
  <line x1="270" y1="250" x2="295" y2="250" stroke="#f9fafb" stroke-width="4"/>

  <path d="M 360 185 A 25 25 0 0 0 410 185" stroke="#4F46E5" stroke-width="2" fill="none"/>
  <line x1="360" y1="185" x2="360" y2="160" stroke="#f9fafb" stroke-width="4"/>

  <!-- Section labels -->
  <text x="225" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#6b7280">GİRİŞ</text>
  <text x="225" y="310" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#6b7280">BAR</text>
  <text x="510" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#6b7280">SALON A</text>
  <text x="430" y="390" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#6b7280">SALON B</text>

  <!-- Tables in Salon A (square tables with chairs) -->
  <!-- Table 1 -->
  <rect x="390" y="130" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="400" y="122" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="400" y="170" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="381" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="430" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>

  <!-- Table 2 -->
  <rect x="460" y="130" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="470" y="122" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="470" y="170" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="451" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="500" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>

  <!-- Table 3 -->
  <rect x="540" y="130" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="550" y="122" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="550" y="170" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="531" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="580" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>

  <!-- Table 4 -->
  <rect x="610" y="130" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="620" y="122" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="620" y="170" width="20" height="8" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="601" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>
  <rect x="650" y="140" width="8" height="20" rx="2" fill="#4F46E5" opacity="0.5"/>

  <!-- Second row Salon A -->
  <rect x="390" y="205" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="460" y="205" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="540" y="205" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>
  <rect x="610" y="205" width="40" height="40" rx="4" fill="#4F46E5" opacity="0.15" stroke="#4F46E5" stroke-width="1.5"/>

  <!-- Round tables in Salon B -->
  <circle cx="430" cy="375" r="22" fill="#4F46E5" opacity="0.12" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="430" cy="375" r="14" fill="#4F46E5" opacity="0.15"/>
  <circle cx="500" cy="375" r="22" fill="#4F46E5" opacity="0.12" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="500" cy="375" r="14" fill="#4F46E5" opacity="0.15"/>
  <circle cx="570" cy="375" r="22" fill="#4F46E5" opacity="0.12" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="570" cy="375" r="14" fill="#4F46E5" opacity="0.15"/>
  <circle cx="640" cy="375" r="22" fill="#4F46E5" opacity="0.12" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="640" cy="375" r="14" fill="#4F46E5" opacity="0.15"/>

  <!-- Bar counter -->
  <rect x="155" y="265" width="185" height="30" rx="4" fill="#4F46E5" opacity="0.2" stroke="#4F46E5" stroke-width="1.5"/>
  <!-- Bar stools -->
  <circle cx="180" cy="255" r="8" fill="#4F46E5" opacity="0.35"/>
  <circle cx="210" cy="255" r="8" fill="#4F46E5" opacity="0.35"/>
  <circle cx="240" cy="255" r="8" fill="#4F46E5" opacity="0.35"/>
  <circle cx="270" cy="255" r="8" fill="#4F46E5" opacity="0.35"/>
  <circle cx="300" cy="255" r="8" fill="#4F46E5" opacity="0.35"/>

  <!-- Entrance area - welcome mat / host stand -->
  <rect x="175" y="135" width="60" height="40" rx="6" fill="#4F46E5" opacity="0.1" stroke="#4F46E5" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Compass / north indicator -->
  <circle cx="660" cy="90" r="18" fill="#4F46E5" opacity="0.1" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="660" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4F46E5">N</text>

  <!-- Scale bar -->
  <line x1="150" y1="490" x2="310" y2="490" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="150" y1="485" x2="150" y2="495" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="230" y1="485" x2="230" y2="495" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="310" y1="485" x2="310" y2="495" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="230" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9ca3af">5m</text>

  <!-- Title bar at top -->
  <rect x="100" y="60" width="600" height="36" rx="12" fill="#4F46E5"/>
  <rect x="100" y="72" width="600" height="24" fill="#4F46E5"/>
  <text x="400" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="white">RESTORAN KAT PLANI</text>
  <!-- Window buttons -->
  <circle cx="128" cy="78" r="6" fill="#818cf8"/>
  <circle cx="148" cy="78" r="6" fill="#a5b4fc"/>
  <circle cx="168" cy="78" r="6" fill="#c7d2fe"/>
</svg>
